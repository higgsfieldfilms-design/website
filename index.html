<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAW — Spotted Ads World</title>
  <style>
    @font-face {
      font-family: 'Neuropol X';
      src: url('fonts/Neuropol_X_Rg.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--aqua:#a97c50;
  --text:#b8a89a;--text-muted:rgba(184,168,154,0.35);
  --border:rgba(184,168,154,0.08);
  --fd:'Neuropol X',monospace;
  --ph:clamp(20px,4vw,48px);
  --nav-h:70px;
}
html{height:100%;scroll-behavior:smooth}
body{height:100%;background:var(--black);color:var(--text);font-family:'Noto Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-y:scroll;scroll-snap-type:none}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:clamp(14px,2vw,22px) var(--ph);border-bottom:1px solid var(--border);background:rgba(10,10,10,0.88);backdrop-filter:blur(12px)}
.nav-logo{cursor:pointer;display:flex;align-items:center}
.nav-logo img{height:26px}
.nav-links{display:flex;gap:4px}
.nav-btn{background:none;border:1px solid transparent;color:var(--text-muted);cursor:pointer;font-family:var(--fd);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;padding:7px 14px;border-radius:2px;transition:color .2s,border-color .2s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--aqua);border-color:var(--aqua)}

/* Ticker */
.ticker{position:fixed;top:var(--nav-h);left:0;right:0;z-index:99;overflow:hidden;height:26px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.6);backdrop-filter:blur(8px)}
.ticker-inner{display:flex;align-items:center;animation:tickerMove 28s linear infinite;white-space:nowrap;padding:4px 0}
@keyframes tickerMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{font-family:var(--fd);font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(184,168,154,0.2);padding:0 20px}
.ticker-dot{width:3px;height:3px;border-radius:50%;background:rgba(184,168,154,0.12);flex-shrink:0}

/* Decorative */
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(169,124,80,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(169,124,80,0.025) 1px,transparent 1px);background-size:60px 60px}
.crosshair{position:fixed;top:50%;left:50%;width:500px;height:500px;margin:-250px 0 0 -250px;border-radius:50%;border:1px solid rgba(169,124,80,0.04);pointer-events:none;z-index:0;animation:crossPulse 8s ease-in-out infinite alternate}
@keyframes crossPulse{from{transform:scale(1);opacity:.5}to{transform:scale(1.1);opacity:1}}

/* Hero */
.hero{position:relative;z-index:1;padding:clamp(100px,13vw,140px) var(--ph) clamp(48px,6vw,72px);min-height:clamp(480px,80vh,680px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero-glow{position:absolute;width:clamp(300px,80vw,600px);height:clamp(200px,55vw,400px);top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(169,124,80,0.06) 0%,transparent 70%);pointer-events:none;animation:glowPulse 6s ease-in-out infinite alternate}
@keyframes glowPulse{from{opacity:.6}to{opacity:1}}
.hero-ring{position:absolute;border-radius:50%;border:1px solid rgba(169,124,80,0.06);pointer-events:none;animation:ringRotate 30s linear infinite}
@keyframes ringRotate{to{transform:rotate(360deg)}}
.eyebrow{position:relative;z-index:1;font-family:var(--fd);font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(169,124,80,0.5);margin-bottom:20px}
.hero-headline{position:relative;z-index:1;font-size:clamp(36px,7vw,80px);font-weight:700;line-height:1.05;color:var(--text);margin-bottom:14px}
.accent{color:var(--aqua);font-style:italic}
.hero-sub{position:relative;z-index:1;font-family:var(--fd);font-size:10px;letter-spacing:0.35em;text-transform:uppercase;color:rgba(169,124,80,0.45);margin-bottom:48px}

/* Three-action tabs */
.three-actions{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);max-width:700px;width:100%;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.action-cell{padding:20px 24px;cursor:pointer;border-right:1px solid var(--border);transition:background .2s;text-align:left}
.action-cell:last-child{border-right:none}
.action-cell:hover{background:rgba(169,124,80,0.04)}
.action-cell.active{background:rgba(169,124,80,0.06)}
.action-idx{font-family:var(--fd);font-size:8px;letter-spacing:0.2em;color:var(--text-muted);margin-bottom:6px}
.action-word{font-family:var(--fd);font-size:14px;letter-spacing:0.1em;color:var(--text);margin-bottom:4px}
.action-cell.active .action-word{color:var(--aqua)}
.action-desc{font-size:10px;color:var(--text-muted);letter-spacing:0.05em}
.action-arrow{font-size:12px;color:var(--text-muted);margin-top:8px;display:inline-block;transition:transform .2s,color .2s}
.action-cell:hover .action-arrow,.action-cell.active .action-arrow{transform:translate(2px,-2px);color:var(--aqua)}

/* Content panels */
.content-panel{position:relative;z-index:1;padding:0 var(--ph) clamp(48px,6vw,80px)}
.panel{padding:40px;border:1px solid var(--border);border-radius:6px;background:rgba(16,14,12,0.6);backdrop-filter:blur(4px);animation:blurIn .45s ease both}
.panel-header{font-family:var(--fd);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:32px;animation:blurIn .5s ease both}
@keyframes blurIn{from{opacity:0;filter:blur(6px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}

/* WE — founder */
.founder-layout{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start;margin-bottom:36px}
.founder-photo-wrap{position:relative}
.founder-photo{width:100%;border-radius:6px;border:1px solid var(--border);display:block;object-fit:cover;filter:grayscale(20%);transition:filter .4s}
.founder-photo:hover{filter:grayscale(0%)}
.founder-photo-glow{position:absolute;inset:-1px;border-radius:6px;background:linear-gradient(135deg,rgba(169,124,80,0.12),transparent 60%);pointer-events:none}
.founder-block{border-left:2px solid var(--aqua);padding-left:20px}
.founder-statement{font-size:13px;line-height:1.85;color:rgba(184,168,154,0.8);margin:0 0 14px 0}
.founder-promise{font-style:italic;color:var(--aqua)}
.founder-sig{margin-top:18px;font-family:var(--fd);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.founder-ig{color:var(--aqua);text-decoration:none;font-size:10px;letter-spacing:0.1em}
.founder-ig:hover{text-decoration:underline}

/* WE — Narrative */
.saw-narrative{margin-bottom:48px;border-left:2px solid rgba(169,124,80,0.3);padding-left:28px}
.narrative-heading{font-family:var(--fd);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--aqua);margin:0 0 14px 0;margin-top:36px}
.saw-narrative .narrative-heading:first-child{margin-top:0}
.narrative-body{font-size:14px;line-height:1.9;color:rgba(184,168,154,0.8);margin:0 0 28px 0}
.narrative-legacy{font-size:15px;font-style:italic;color:var(--aqua);margin:0;letter-spacing:0.03em}

/* SAW — work */
.work-section-label{font-family:var(--fd);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--aqua);margin-bottom:16px;margin-top:8px}
.work-client-label{font-family:var(--fd);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.work-client-count{font-size:9px;color:var(--aqua);border:1px solid rgba(169,124,80,0.3);border-radius:20px;padding:2px 8px}
.work-grid-h{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:10px}
.work-grid-v{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.work-card{background:#111;border:1px solid var(--border);border-radius:4px;overflow:hidden;position:relative;cursor:pointer;transition:border-color .3s;will-change:transform;transform-style:preserve-3d}
.work-card.h{aspect-ratio:16/9}
.work-card.v{aspect-ratio:9/16}
.work-card:hover{border-color:rgba(169,124,80,0.3)}
.work-card-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:44px;height:44px;border:2px solid rgba(255,255,255,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s,transform .3s;backdrop-filter:blur(4px);background:rgba(0,0,0,0.3)}
.work-card:hover .work-card-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.play-tri{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid white;margin-left:2px}
.work-card-info{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,transparent 100%)}
.work-card-name{font-size:11px;color:rgba(255,255,255,0.8);letter-spacing:0.05em;margin-bottom:2px}
.work-card-tag{font-family:var(--fd);font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:var(--aqua)}

/* Photo/creative grid with TiltCard */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:8px}
.tilt-photo-card{position:relative;overflow:hidden;border-radius:6px;border:1px solid var(--border);background:#0a0a0a;cursor:pointer;will-change:transform;transform-style:preserve-3d;transition:border-color .3s,box-shadow .3s}
.tilt-photo-card:hover{border-color:rgba(169,124,80,0.5);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.tilt-photo-img{width:100%;height:auto;display:block;object-fit:contain}
.tilt-glare{position:absolute;inset:0;pointer-events:none;border-radius:6px;opacity:0;transition:opacity .2s}
.work-closing{margin-top:48px;padding:24px;border-top:1px solid var(--border);font-size:13px;line-height:1.85;color:rgba(184,168,154,0.65);font-style:italic;text-align:center}

/* YOU COMING */
.cta-hero-text{font-family:var(--fd);letter-spacing:0.04em;font-size:clamp(22px,4vw,36px);line-height:1.3;font-weight:700;color:var(--text);margin-bottom:32px}
.onboard-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.step{padding:20px;border:1px solid var(--border);border-radius:4px}
.step-num{font-family:var(--fd);font-size:22px;font-weight:400;letter-spacing:0.08em;color:var(--aqua);margin-bottom:6px}
.step-title{font-family:var(--fd);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text);margin-bottom:8px}
.step-body{font-family:var(--fd);font-size:9px;letter-spacing:0.1em;line-height:1.7;color:var(--text-muted)}
.onboard-cta{display:flex;gap:10px;align-items:center}
.cta-input{flex:1;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:3px;color:var(--text);padding:11px 16px;font-family:var(--fd);font-size:11px;letter-spacing:0.1em;outline:none;transition:border-color .2s}
.cta-input::placeholder{color:rgba(184,168,154,0.25)}
.cta-input:focus{border-color:var(--aqua)}
.cta-btn{background:none;border:1px solid var(--aqua);color:var(--aqua);padding:11px 22px;border-radius:3px;cursor:pointer;font-family:var(--fd);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;transition:background .2s,color .2s;white-space:nowrap}
.cta-btn:hover{background:var(--aqua);color:var(--black)}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.96);display:flex;align-items:center;justify-content:center;animation:lbIn .3s ease;backdrop-filter:blur(8px)}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lightbox-inner{width:min(90vw,900px);position:relative}
.lightbox-inner-reel{width:min(calc(80vh * 9/16),380px)}
.lightbox-iframe{display:block;border-radius:4px;border:1px solid var(--border)}
.lightbox-close{position:absolute;top:-42px;right:0;background:none;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.4);border-radius:20px;cursor:pointer;font-family:var(--fd);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;padding:6px 14px;transition:all .2s}
.lightbox-close:hover{color:var(--text);border-color:var(--aqua)}
.lightbox-meta{font-family:var(--fd);font-size:11px;color:var(--aqua);margin-top:12px;letter-spacing:0.12em}

/* Footer */
.site-footer{position:relative;z-index:1;padding:clamp(16px,2.5vw,24px) var(--ph);display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border)}
.footer-copy{font-size:10px;color:rgba(184,168,154,0.25);letter-spacing:0.05em}
.footer-links{display:flex;gap:16px}
.footer-link{font-family:var(--fd);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(184,168,154,0.25);text-decoration:none;transition:color .2s}
.footer-link:hover{color:var(--aqua)}

/* ── Hero rings — fluid sizing ──────────────────────────── */
.hero-ring-1{width:clamp(200px,55vw,420px);height:clamp(200px,55vw,420px);margin-top:calc(clamp(200px,55vw,420px) / -2);margin-left:calc(clamp(200px,55vw,420px) / -2)}
.hero-ring-2{width:clamp(280px,80vw,600px);height:clamp(280px,80vw,600px);margin-top:calc(clamp(280px,80vw,600px) / -2);margin-left:calc(clamp(280px,80vw,600px) / -2)}

/* ── Responsive ──────────────────────────────────────────── */

/* Wide screens (≥ 1440px) — expand and centre */
@media(min-width:1440px){
  :root{--ph:clamp(56px,6vw,120px)}
  .content-panel{max-width:1600px;margin-left:auto;margin-right:auto}
  .hero{max-width:1600px;margin-left:auto;margin-right:auto}
  .site-footer{max-width:1600px;margin-left:auto;margin-right:auto}
  .three-actions{max-width:840px}
  .work-grid-h{grid-template-columns:repeat(3,1fr)}
  .work-grid-v{grid-template-columns:repeat(5,1fr)}
  .photo-grid{grid-template-columns:repeat(5,1fr)}
}

/* Standard desktop (1024–1439px) */
@media(min-width:1024px) and (max-width:1439px){
  .work-grid-h{grid-template-columns:repeat(3,1fr)}
  .work-grid-v{grid-template-columns:repeat(4,1fr)}
  .photo-grid{grid-template-columns:repeat(4,1fr)}
}

/* Tablet landscape (768–1023px) */
@media(min-width:768px) and (max-width:1023px){
  :root{--ph:clamp(28px,4vw,44px);--nav-h:66px}
  .hero{padding:96px var(--ph) 52px}
  .founder-layout{grid-template-columns:180px 1fr}
  .work-grid-h{grid-template-columns:repeat(2,1fr)}
  .work-grid-v{grid-template-columns:repeat(3,1fr)}
  .photo-grid{grid-template-columns:repeat(3,1fr)}
}

/* Tablet portrait + large phones (480–767px) */
@media(max-width:767px){
  :root{--ph:clamp(18px,5.5vw,32px);--nav-h:58px}
  .ticker{top:58px}
  .hero{padding:84px var(--ph) 44px;min-height:auto}
  .hero-headline{font-size:clamp(28px,7vw,44px)}
  .panel{padding:clamp(18px,4vw,28px)}
  .three-actions{grid-template-columns:1fr;max-width:100%}
  .action-cell{border-right:none;border-bottom:1px solid var(--border)}
  .action-cell:last-child{border-bottom:none}
  .founder-layout{grid-template-columns:1fr;gap:20px}
  .founder-photo{max-width:180px}
  .work-grid-h{grid-template-columns:repeat(2,1fr);gap:8px}
  .work-grid-v{grid-template-columns:repeat(2,1fr);gap:8px}
  .photo-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .onboard-steps{grid-template-columns:1fr}
  .onboard-cta{flex-direction:column;gap:8px}
  .cta-btn{width:100%;text-align:center}
  .crosshair{width:260px;height:260px;margin:-130px 0 0 -130px}
  .lightbox-inner{width:95vw}
}

/* Small phones (< 480px) */
@media(max-width:479px){
  :root{--ph:16px;--nav-h:50px}
  .nav{padding:12px 16px}
  .nav-logo img{height:22px}
  .nav-btn{padding:5px 8px;font-size:8px;letter-spacing:0.12em}
  .ticker{top:50px}
  .hero{padding:70px 16px 36px}
  .hero-headline{font-size:clamp(22px,7.5vw,32px)}
  .work-grid-h{grid-template-columns:1fr}
  .work-grid-v{grid-template-columns:repeat(2,1fr);gap:6px}
  .photo-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .step{padding:14px 12px}
  .crosshair{width:180px;height:180px;margin:-90px 0 0 -90px}
  .lightbox-inner{width:98vw}
  .lightbox-close{top:-34px;padding:5px 10px}
}

/* Micro (< 360px) */
@media(max-width:359px){
  :root{--ph:12px;--nav-h:46px}
  .nav-btn{padding:4px 6px;font-size:7.5px;letter-spacing:0.08em}
  .ticker{top:46px}
  .work-grid-h{grid-template-columns:1fr}
  .work-grid-v{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(2,1fr)}
}
  </style>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Helpers ──────────────────────────────────────────────
function getVideoId(url) {
  let m = url.match(/youtu\.be\/([^?]+)/) || url.match(/[?&]v=([^&]+)/);
  if (m) return { platform: 'yt', id: m[1] };
  m = url.match(/shorts\/([^?]+)/);
  if (m) return { platform: 'yt', id: m[1] };
  m = url.match(/youtube\.com\/embed\/([^?]+)/);
  if (m) return { platform: 'yt', id: m[1] };
  m = url.match(/(?:vimeo\.com\/(?:video\/)?|player\.vimeo\.com\/video\/)(\d+)/);
  if (m) return { platform: 'vimeo', id: m[1] };
  return null;
}
function getEmbedUrl(video, autoplay) {
  const ap = autoplay ? '1' : '0';
  if (video.type === 'vimeo') {
    const m = video.url.match(/(?:vimeo\.com\/(?:video\/)?|player\.vimeo\.com\/video\/)(\d+)/);
    const id = m ? m[1] : null;
    return id ? `https://player.vimeo.com/video/${id}?autoplay=${ap}&badge=0&autopause=0&player_id=0&app_id=58479&loop=1` : '';
  }
  const parsed = getVideoId(video.url);
  if (parsed?.platform === 'yt') {
    return `https://www.youtube.com/embed/${parsed.id}?${autoplay ? 'autoplay=1&' : ''}rel=0`;
  }
  return '';
}

// ── Portfolio data ───────────────────────────────────────
const CLIENTS = [
  { name:'Horizontal', aspect:'h', videos:[
    {type:'yt',url:'https://www.youtube.com/embed/XxoFbsL5_nw'},
    {type:'yt',url:'https://www.youtube.com/embed/Iw-rJHUUvLM'},
    {type:'yt',url:'https://www.youtube.com/embed/BmWNTkPWUyM'},
    {type:'yt',url:'https://www.youtube.com/embed/wyg4F-LRmGw'},
    {type:'yt',url:'https://www.youtube.com/embed/zbsD-ZX6efg'},
  ]},
  { name:'Vertical', aspect:'v', videos:[
    {type:'yt',url:'https://www.youtube.com/embed/lJfbXSz7EQY'},
    {type:'yt',url:'https://www.youtube.com/embed/he8W9uErv3E'},
    {type:'yt',url:'https://www.youtube.com/embed/DnIgncNX4Eg'},
    {type:'yt',url:'https://www.youtube.com/embed/X0nFOneVruA'},
    {type:'vimeo',url:'https://player.vimeo.com/video/1187266206?badge=0&autopause=0&player_id=0&app_id=58479&loop=1'},
  ]},
];

const TICKER_ITEMS = [
  'Spotted Ads World','Film Production','Creative Direction',
  'Brand Identity','Digital Campaigns','Performance',
  'Spotted Ads World','Film Production','Creative Direction',

// ── Lazy embed ───────────────────────────────────────────
function LazyEmbed({ video }) {
  const ref = useRef(null);
  const [load, setLoad] = useState(false);
  const [vimeoThumb, setVimeoThumb] = useState('');
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setLoad(true); obs.disconnect(); }
    }, { rootMargin: '300px' });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  useEffect(() => {
    if (!load || video.type !== 'vimeo') return;
    const m = video.url.match(/\/(\d+)/);
    if (!m) return;
    fetch(`https://vimeo.com/api/v2/video/${m[1]}.json`)
      .then(r => r.json())
      .then(d => setVimeoThumb(d[0]?.thumbnail_large || ''))
      .catch(() => {});
  }, [load, video.url, video.type]);
  const parsed = getVideoId(video.url);
  const thumb = video.type === 'vimeo'
    ? vimeoThumb
    : parsed ? `https://img.youtube.com/vi/${parsed.id}/hqdefault.jpg` : '';
  return (
    <div ref={ref} style={{position:'absolute',inset:0,overflow:'hidden'}}>
      {load && thumb && <img src={thumb} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} />}
    </div>
  );
}

// ── Lightbox ─────────────────────────────────────────────
function Lightbox({ video, client, onClose }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  const embedUrl = getEmbedUrl(video, true);
  const isH = video.aspect === 'h';
  return (
    <div className="lightbox" onClick={onClose}>
      <div className={`lightbox-inner${isH ? '' : ' lightbox-inner-reel'}`}
        onClick={e => e.stopPropagation()}>
        <button className="lightbox-close" onClick={onClose}>Close ×</button>
        <iframe src={embedUrl} className="lightbox-iframe" frameBorder="0"
          allowFullScreen allow="autoplay; encrypted-media; picture-in-picture"
          style={{
            width:'100%',
            aspectRatio: isH ? '16/9' : '9/16',
            maxHeight: isH ? 'auto' : '85vh',
            border:'none', background:'#000',
          }} />
        <div className="lightbox-meta">{client}</div>
      </div>
    </div>
  );
}

// ── Video tilt card ──────────────────────────────────────
function VideoTiltCard({ video, aspect, label, tag, onClick }) {
  const cardRef = useRef(null);
  const glareRef = useRef(null);
  const onEnter = () => { if (cardRef.current) cardRef.current.style.transition = 'none'; };
  const onMove = (e) => {
    const card = cardRef.current;
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    card.style.transform = `perspective(900px) rotateX(${-y*8}deg) rotateY(${x*8}deg) scale3d(1.03,1.03,1.03)`;
    if (glareRef.current) {
      glareRef.current.style.opacity = '1';
      glareRef.current.style.background = `radial-gradient(circle at ${(x+0.5)*100}% ${(y+0.5)*100}%, rgba(255,255,255,0.1) 0%, transparent 65%)`;
    }
  };
  const onLeave = () => {
    const card = cardRef.current;
    if (!card) return;
    card.style.transition = 'transform 0.6s cubic-bezier(0.23,1,0.32,1)';
    card.style.transform = 'perspective(900px) rotateX(0) rotateY(0) scale3d(1,1,1)';
    if (glareRef.current) glareRef.current.style.opacity = '0';
  };
  return (
    <div ref={cardRef} className={`work-card ${aspect}`}
      onMouseEnter={onEnter} onMouseMove={onMove} onMouseLeave={onLeave}
      onClick={onClick} style={{willChange:'transform',transformStyle:'preserve-3d'}}>
      <LazyEmbed video={video} />
      <div className="work-card-play"><div className="play-tri" /></div>
      <div className="work-card-glare" ref={glareRef} style={{
        position:'absolute',inset:0,pointerEvents:'none',opacity:0,borderRadius:4,transition:'opacity 0.2s'
      }} />
      <div className="work-card-info">
        <div className="work-card-name">{label}</div>
        <div className="work-card-tag">{tag}</div>
      </div>
    </div>
  );
}

// ── TiltCard (3-D hover + glare) ─────────────────────────
function TiltCard({ src, alt }) {
  const cardRef = useRef(null);
  const glareRef = useRef(null);
  const onEnter = () => { if (cardRef.current) cardRef.current.style.transition = 'none'; };
  const onMove = (e) => {
    const card = cardRef.current;
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    card.style.transform = `perspective(800px) rotateX(${-y*12}deg) rotateY(${x*12}deg) scale3d(1.04,1.04,1.04)`;
    if (glareRef.current) {
      glareRef.current.style.opacity = '1';
      glareRef.current.style.background = `radial-gradient(circle at ${(x+0.5)*100}% ${(y+0.5)*100}%, rgba(255,255,255,0.15) 0%, transparent 65%)`;
    }
  };
  const onLeave = () => {
    const card = cardRef.current;
    if (!card) return;
    card.style.transition = 'transform 0.6s cubic-bezier(0.23,1,0.32,1), box-shadow 0.3s';
    card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) scale3d(1,1,1)';
    if (glareRef.current) glareRef.current.style.opacity = '0';
  };
  return (
    <div ref={cardRef} className="tilt-photo-card"
      onMouseEnter={onEnter} onMouseMove={onMove} onMouseLeave={onLeave}>
      <img src={src} alt={alt || ''} className="tilt-photo-img" loading="lazy" />
      <div ref={glareRef} className="tilt-glare" />
    </div>
  );
}

          {tabs.map(t => (
            <button key={t.key}
              className={`nav-btn${active===t.key?' active':''}`}
              onClick={() => handleTabClick(t.key)}>
              {t.word}
            </button>
          ))}
        </div>
      </nav>

      {/* Ticker */}
      <div className="ticker">
        <div className="ticker-inner">
          {TICKER_ITEMS.map((item, i) => (
            <React.Fragment key={i}>
              <span className="ticker-item">{item}</span>
              <span className="ticker-dot" />
            </React.Fragment>
          ))}
        </div>
      </div>

      {/* Hero */}
      <div className="hero">
        <div className="hero-glow" />
        <div className="hero-ring hero-ring-1" />
        <div className="hero-ring hero-ring-2" style={{animationDirection:'reverse',animationDuration:'40s'}} />
        <div className="eyebrow">Spotted Ads World</div>
        <div className="hero-headline">
          The world doesn't remember average.<br />Neither do we.
        </div>

        {/* Action tabs */}
        <div className="three-actions">
          {tabs.map(t => (
            <div key={t.key}
              className={`action-cell${active===t.key?' active':''}`}
              onClick={() => handleTabClick(t.key)}>
              <div className="action-idx">{t.idx} —</div>
              <div className="action-word">{t.word}</div>
              <div className="action-desc">{t.desc}</div>
              <div className="action-arrow">↗</div>
            </div>
          ))}
        </div>
      </div>

      {/* Content panels */}
      <div className="content-panel" ref={panelRef}>
        {active === 'we'  && <PanelWe />}
        {active === 'saw' && <PanelSaw openLightbox={openLightbox} />}
        {active === 'you' && <PanelYou />}
      </div>

      {/* Footer */}
      <footer className="site-footer">
        <span className="footer-copy">© 2025 Spotted Ads World</span>
        <div className="footer-links">
          <a className="footer-link" href="#" onClick={e=>e.preventDefault()}>Instagram</a>
          <a className="footer-link" href="#" onClick={e=>e.preventDefault()}>YouTube</a>
        </div>
      </footer>

      {/* Lightbox */}
      {lightbox && <Lightbox video={lightbox.video} client={lightbox.client}
        onClose={() => setLightbox(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
